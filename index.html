<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HZ Mega Store | 2000+ Items</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-card { transition: 0.3s; border: 1px solid #2d3748; }
        .product-card:hover { border-color: #e53e3e; transform: translateY(-3px); }
        #searchBar:focus { ring: 2px; ring-color: #e53e3e; outline: none; }
    </style>
</head>
<body class="bg-black text-white">

    <nav class="sticky top-0 z-50 bg-black border-b border-gray-800 p-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-black text-red-600 italic">HZ SPORTS</h1>
            <input type="text" id="searchBar" placeholder="Search 2,000+ items (e.g. 'Red Tracksuit', 'Bike 500')..." 
                   class="w-full md:w-1/2 p-3 rounded-lg bg-gray-900 border border-gray-700 text-white">
            <div class="flex gap-4 text-xs font-bold uppercase text-gray-400">
                <span>Items: <span id="itemCount" class="text-red-500">2000</span></span>
                <a href="https://wa.me/923488480203" class="text-green-500 underline">Help</a>
            </div>
        </div>
    </nav>

    <header class="py-12 text-center bg-gradient-to-r from-red-900 to-red-600">
        <h2 class="text-4xl font-black uppercase">HZ Global Inventory</h2>
        <p class="opacity-80">Bulk Export & Retail | Factory Direct from Faisalabad</p>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <footer class="p-10 text-center border-t border-gray-900 text-gray-500 text-sm">
        <p>United Bank Ltd (UBL): PK43 UNIL 0109 0003 3917 2252</p>
        <p class="mt-2">© 2026 HZ SPORTS GLOBAL</p>
    </footer>

    <script>
        const products = [];
        const categories = ["Tracksuit", "Cycle", "Shoes", "Supplements", "Gym Gear"];
        const colors = ["Red", "Black", "Blue", "Silver", "Grey", "Neon"];
        
        // --- 1. GENERATE 2000 ITEMS AUTOMATICALLY ---
        for (let i = 1; i <= 2000; i++) {
            const cat = categories[Math.floor(Math.random() * categories.length)];
            const col = colors[Math.floor(Math.random() * colors.length)];
            const pricePKR = Math.floor(Math.random() * (90000 - 1500) + 1500).toLocaleString();
            
            products.push({
                id: i,
                name: `HZ ${col} ${cat} #${1000 + i}`,
                category: cat,
                price: `${pricePKR} PKR`,
                img: `https://picsum.photos/seed/${i + 50}/400/400` // Random high-quality placeholders
            });
        }

        const grid = document.getElementById('productGrid');
        const searchBar = document.getElementById('searchBar');

        // --- 2. DISPLAY FUNCTION ---
        function displayProducts(items) {
            grid.innerHTML = items.map(p => `
                <div class="product-card bg-gray-900 rounded-xl overflow-hidden p-3 flex flex-col justify-between">
                    <img src="${p.img}" class="rounded-lg h-40 w-full object-cover mb-3" loading="lazy">
                    <div>
                        <h4 class="font-bold text-sm h-10 overflow-hidden text-gray-100">${p.name}</h4>
                        <p class="text-red-500 font-bold mt-2">${p.price}</p>
                    </div>
                    <a href="https://wa.me/923488480203?text=Order Item ID ${p.id}: ${p.name}" 
                       class="mt-4 block w-full text-center bg-red-600 hover:bg-red-700 text-white text-xs py-2 rounded-lg font-bold">
                       Buy via WhatsApp
                    </a>
                </div>
            `).join('');
            document.getElementById('itemCount').innerText = items.length;
        }

        // --- 3. LIVE SEARCH LOGIC ---
        searchBar.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(val));
            displayProducts(filtered);
        });

        // Initial Load (Show first 2000 items)
        displayProducts(products);
    </script>
</body>
</html>
