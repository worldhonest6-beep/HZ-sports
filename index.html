<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HZ SPORTS | Official Global Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-card { transition: 0.3s; border: 1px solid #2d3748; background: #0a0a0a; border-radius: 15px; overflow: hidden; }
        .product-card:hover { border-color: #ff0000; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255,0,0,0.1); }
        .img-zoom { transition: transform .5s ease; }
        .product-card:hover .img-zoom { transform: scale(1.1); }
    </style>
</head>
<body class="bg-black text-white font-sans">

    <nav class="sticky top-0 z-50 bg-black/90 backdrop-blur-md border-b border-red-900 p-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <div class="bg-red-600 p-2 rounded-sm rotate-12 font-black text-xl italic">HZ</div>
                <h1 class="text-2xl font-black tracking-tighter italic">SPORTS</h1>
            </div>
            <div class="flex items-center gap-2 w-full md:w-1/2">
                <input type="text" id="searchBar" placeholder="Search premium gear..." 
                       class="w-full p-3 rounded-l-lg bg-gray-900 border border-gray-700 text-white focus:outline-none">
                <select id="currency" class="p-3 bg-red-600 rounded-r-lg font-bold text-sm">
                    <option value="PKR">PKR</option>
                    <option value="USD">USD</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8">
            </div>
    </main>

    <footer class="p-10 text-center text-gray-700 text-xs border-t border-gray-900">
        &copy; 2026 HZ SPORTS GLOBAL | FAISALABAD EXPORT QUALITY
    </footer>

    <script>
        // High-Quality Attractive Image Links
        const imgBank = {
            "Tracksuit": "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500&q=80",
            "Road Cycle": "https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=500&q=80",
            "Crossfit Shoes": "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80",
            "Whey Pro": "https://images.unsplash.com/photo-1593095191071-82b0fdd871a2?w=500&q=80",
            "Dumbbell Set": "https://images.unsplash.com/photo-1638536532686-d610adfc8e5c?w=500&q=80",
            "Sport Hoodie": "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500&q=80"
        };

        const products = [];
        const categories = Object.keys(imgBank);
        const colors = ["Stealth Black", "Crimson Red", "Royal Blue", "Titanium Grey"];
        let curr = "PKR";

        for (let i = 1; i <= 2000; i++) {
            const cat = categories[Math.floor(Math.random() * categories.length)];
            const col = colors[Math.floor(Math.random() * colors.length)];
            const base = Math.floor(Math.random() * (55000 - 2500) + 2500);
            
            products.push({
                id: i,
                name: `HZ ${col} ${cat}`,
                pkr: base,
                usd: Math.round(base / 278),
                img: imgBank[cat] // Uses the matching high-quality image
            });
        }

        const grid = document.getElementById('productGrid');
        function render(items) {
            grid.innerHTML = items.map(p => `
                <div class="product-card">
                    <div class="overflow-hidden h-40 md:h-56">
                        <img src="${p.img}" class="img-zoom w-full h-full object-cover">
                    </div>
                    <div class="p-4">
                        <h4 class="text-[11px] font-bold uppercase tracking-tight h-8 overflow-hidden">${p.name} #${100+p.id}</h4>
                        <p class="text-red-500 font-black mt-2 text-base">
                            ${curr === "PKR" ? p.pkr.toLocaleString() + ' PKR' : '$' + p.usd}
                        </p>
                        <a href="https://wa.me/923488480203?text=Interested in ID:${p.id} - ${p.name}" 
                           class="mt-4 block text-center bg-white text-black text-[10px] font-black py-3 rounded-lg uppercase hover:bg-red-600 hover:text-white transition">
                           Order on WhatsApp
                        </a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('currency').onchange = (e) => { curr = e.target.value; render(products); };
        document.getElementById('searchBar').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            render(products.filter(p => p.name.toLowerCase().includes(val)));
        };
        render(products);
    </script>
</body>
</html>
